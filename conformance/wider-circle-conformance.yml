regime_note: >-
  Assessed against the health regulatory regime (HIPAA (US), FHIR / US Core,
  21st Century Cures Act). Wider Circle is a HIPAA Business Associate operating on
  Medicare Advantage and Medicaid member data on behalf of health plans, so the
  privacy/security half of the regime applies and is well documented. The
  interoperability half - FHIR, US Core, CARIN, Da Vinci, bulk data - does not apply

aid: wider-circle
name: Wider Circle
description: 'Wider Circle is a Redwood City, California community-health company that
  partners with Medicare Advantage, Medicaid and D-SNP health plans to close the "last
  mile" of care through peer-driven neighborhood groups. Its Connect for Life program
  clusters plan members by claims-derived affinity, recruits and trains local Ambassadors
  and Facilitators, and runs in-person and virtual group programming aimed at annual
  wellness visits, CAHPS and Star Ratings, medication adherence, social isolation and
  social determinants of health. The technology stack behind the model is operated as
  an internal platform and a Salesforce Experience Cloud facilitator portal; as of this
  profile Wider Circle publishes no public developer program, API documentation, or
  machine-readable API contract of any kind.'
